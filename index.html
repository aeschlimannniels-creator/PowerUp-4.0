<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerUp 4.0 Controller</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; position: relative; }
    .version { position: absolute; top: 15px; right: 15px; font-size: 16px; color: #30d158; font-weight: bold; }
    
    h1 { font-size: 22px; margin-bottom: 15px; margin-top: 20px; }
    button { background: #007aff; color: white; border: none; padding: 16px 24px; font-size: 17px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; max-width: 320px; margin-bottom: 15px; }
    button:active { background: #0056b3; }
    
    /* Der Freischalt-Button */
    #armBtn { background: #ff9f0a; display: none; margin-top: 10px; }
    #armBtn:active { background: #cc7f08; }

    .card { background: #1c1c1e; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: left; max-width: 320px; margin-left: auto; margin-right: auto; }
    .status { font-weight: bold; color: #0a84ff; }
    .val { font-weight: bold; color: #30d158; font-size: 18px; }
    .connected { color: #30d158; }
    .disconnected { color: #ff453a; }
    .warning { color: #ff9f0a; }
  </style>
</head>
<body>

  <!-- Neue Version v.1.3 -->
  <div class="version">v.1.3</div>

  <h1>PowerUp 4.0 Steuerung</h1>
  <button id="connectBtn">PowerUp 4.0 Verbinden</button>
  <button id="armBtn">🚀 Motoren Freischalten</button>

  <div class="card">
    <p><strong>Bluetooth:</strong> <span id="bleStatus" class="status disconnected">Nicht verbunden</span></p>
    <p><strong>Gamepad:</strong> <span id="gamepadStatus" class="status">Taste drücken...</span></p>
  </div>

  <div class="card">
    <p>Schub (L. Stick Hoch): <span id="throttleVal" class="val">0 %</span></p>
    <p>Lenkung (R. Stick X): <span id="steeringVal" class="val">0</span></p>
    <p>Motor Links: <span id="motorLeftVal" class="val">0 %</span></p>
    <p>Motor Rechts: <span id="motorRightVal" class="val">0 %</span></p>
  </div>

  <script>
    // Wieder auf die Einzel-Adresse aus v.1.1 gewechselt, da Bluefy sonst abstürzt
    const SERVICE_UUID = '0000fef5-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let controlCharacteristic = null;
    let isConnected = false;
    let readyToSend = false;

    document.getElementById('connectBtn').addEventListener('click', async () => {
      const bleStatus = document.getElementById('bleStatus');
      const armBtn = document.getElementById('armBtn');
      document.getElementById('connectBtn').style.display = 'none';

      try {
        readyToSend = false;
        bleStatus.innerText = "Suche Flugzeug...";
        bleStatus.className = "status";

        // Hier nutzen wir wieder den funktionierenden Code aus 1.1
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        bleStatus.innerText = "Verbinde mit Modul...";
        const server = await bleDevice.gatt.connect();
        
        bleStatus.innerText = "Lade Steuerung...";
        await new Promise(resolve => setTimeout(resolve, 500));

        const service = await server.getPrimaryService(SERVICE_UUID);
        
        // Auto-Discovery: Code sucht sich selbst den richtigen Kanal zum Schreiben
        const characteristics = await service.getCharacteristics();
        for (let char of characteristics) {
          if (char.properties.write || char.properties.writeWithoutResponse) {
            controlCharacteristic = char;
            break; 
          }
        }

        if (!controlCharacteristic) {
          throw new Error("Kein Steuerkanal gefunden");
        }

        isConnected = true;
        bleStatus.innerText = "Verbunden! Bitte Freischalten drücken.";
        bleStatus.className = "status warning";
        
        // Zeige den Sicherheitsknopf an
        armBtn.style.display = 'inline-block';

      } catch (err) {
        console.error("Verbindungsfehler:", err);
        isConnected = false;
        document.getElementById('connectBtn').style.display = 'inline-block';
        armBtn.style.display = 'none';
        bleStatus.innerText = "Fehler: " + (err.message || err);
        bleStatus.className = "status disconnected";
      }
    });

    document.getElementById('armBtn').addEventListener('click', async () => {
      const bleStatus = document.getElementById('bleStatus');
      document.getElementById('armBtn').style.display = 'none';
      bleStatus.innerText = "Entsichere Regler...";
      bleStatus.className = "status warning";

      try {
        // Sende die Null-Gas Sequenz, um den Regler freizuschalten
        for(let i = 0; i < 15; i++) {
          await writeToModule(0, 0);
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        readyToSend = true;
        bleStatus.innerText = "Startbereit! Motoren aktiv.";
        bleStatus.className = "status connected";
      } catch (err) {
        bleStatus.innerText = "Freischalt-Fehler: " + err.message;
        bleStatus.className = "status disconnected";
      }
    });

    function onDisconnected() {
      isConnected = false;
      readyToSend = false;
      controlCharacteristic = null;
      document.getElementById('connectBtn').style.display = 'inline-block';
      document.getElementById('armBtn').style.display = 'none';
      const bleStatus = document.getElementById('bleStatus');
      bleStatus.innerText = "Verbindung getrennt";
      bleStatus.className = "status disconnected";
    }

    function loop() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = Array.from(gamepads).find(g => g !== null);

      if (gp) {
        document.getElementById('gamepadStatus').innerText = gp.id.substring(0, 22) + "...";

        let rawY = -gp.axes[1]; 
        let rawX = gp.axes.length > 2 ? gp.axes[2] : 0; 

        if (Math.abs(rawY) < 0.15) rawY = 0;
        if (Math.abs(rawX) < 0.15) rawX = 0;

        let throttle = 0;
        if (rawY > 0) throttle = Math.round(rawY * 100);
        let steering = Math.round(rawX * 100);

        let leftMotor = 0;
        let rightMotor = 0;

        if (throttle > 0) {
          leftMotor = throttle + (steering * 0.5);
          rightMotor = throttle - (steering * 0.5);

          leftMotor = Math.max(0, Math.min(100, Math.round(leftMotor)));
          rightMotor = Math.max(0, Math.min(100, Math.round(rightMotor)));
        }

        document.getElementById('throttleVal').innerText = throttle + " %";
        document.getElementById('steeringVal').innerText = steering;
        document.getElementById('motorLeftVal').innerText = leftMotor + " %";
        document.getElementById('motorRightVal').innerText = rightMotor + " %";

        if (readyToSend) {
          sendMotorCommands(leftMotor, rightMotor);
        }
      } else {
        document.getElementById('gamepadStatus').innerText = "Kein Controller aktiv";
      }

      requestAnimationFrame(loop);
    }

    let lastSendTime = 0;
    async function sendMotorCommands(left, right) {
      const now = Date.now();
      if (!isConnected || !readyToSend || !controlCharacteristic || (now - lastSendTime < 80)) {
        return; 
      }
      lastSendTime = now;

      const leftPwm = Math.round((left / 100) * 255);
      const rightPwm = Math.round((right / 100) * 255);
      await writeToModule(leftPwm, rightPwm);
    }

    async function writeToModule(leftByte, rightByte) {
      if (!controlCharacteristic) return;
      
      const data = new Uint8Array([leftByte, rightByte]);
      
      try {
        if (controlCharacteristic.properties.writeWithoutResponse) {
          await controlCharacteristic.writeValueWithoutResponse(data);
        } else {
          await controlCharacteristic.writeValue(data);
        }
      } catch (e) {
        console.warn("BLE Schreib-Warnung:", e);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
