<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerUp 4.0 Controller</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    h1 { font-size: 22px; margin-bottom: 15px; }
    button { background: #007aff; color: white; border: none; padding: 16px 24px; font-size: 17px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; max-width: 320px; margin-bottom: 15px; }
    button:active { background: #0056b3; }
    .card { background: #1c1c1e; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: left; max-width: 320px; margin-left: auto; margin-right: auto; }
    .status { font-weight: bold; color: #0a84ff; }
    .val { font-weight: bold; color: #30d158; font-size: 18px; }
    .connected { color: #30d158; }
    .disconnected { color: #ff453a; }
  </style>
</head>
<body>

  <h1>PowerUp 4.0 Steuerung</h1>
  <button id="connectBtn">PowerUp 4.0 Verbinden</button>

  <div class="card">
    <p><strong>Bluetooth:</strong> <span id="bleStatus" class="status disconnected">Nicht verbunden</span></p>
    <p><strong>Gamepad:</strong> <span id="gamepadStatus" class="status">Taste drücken...</span></p>
  </div>

  <div class="card">
    <p>Schub (Linker Stick Y): <span id="throttleVal" class="val">0 %</span></p>
    <p>Lenkung (Rechter Stick X): <span id="steeringVal" class="val">0</span></p>
    <p>Motor Links: <span id="motorLeftVal" class="val">0 %</span></p>
    <p>Motor Rechts: <span id="motorRightVal" class="val">0 %</span></p>
  </div>

  <script>
    // PowerUp 4.0 BLE UUIDs
    const SERVICE_UUID = '0000fef5-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000b012-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let controlCharacteristic = null;
    let isConnected = false;

    // Bluetooth Verbindung herstellen
    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        const bleStatus = document.getElementById('bleStatus');
        bleStatus.innerText = "Suche Gerät...";
        bleStatus.className = "status";

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'PowerUp' }, { services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        controlCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        isConnected = true;
        bleStatus.innerText = "Verbunden mit " + (bleDevice.name || "PowerUp 4.0");
        bleStatus.className = "status connected";
      } catch (err) {
        console.error(err);
        const bleStatus = document.getElementById('bleStatus');
        bleStatus.innerText = "Fehler: " + err.message;
        bleStatus.className = "status disconnected";
      }
    });

    function onDisconnected() {
      isConnected = false;
      const bleStatus = document.getElementById('bleStatus');
      bleStatus.innerText = "Verbindung getrennt";
      bleStatus.className = "status disconnected";
    }

    // Hauptschleife für Gamepad-Eingaben
    function loop() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = Array.from(gamepads).find(g => g !== null);

      if (gp) {
        document.getElementById('gamepadStatus').innerText = gp.id.substring(0, 22) + "...";

        // Stick-Werte auslesen (Pro Controller: Stick Y nach oben ist negativ, daher umkehren)
        let rawThrottle = -gp.axes[1]; 
        let rawSteering = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];

        // Deadzone (kleines Stick-Driften ignorieren)
        if (Math.abs(rawThrottle) < 0.08) rawThrottle = 0;
        if (Math.abs(rawSteering) < 0.08) rawSteering = 0;

        // Schub berechnen (0% bis 100%)
        let throttle = Math.round(((rawThrottle + 1) / 2) * 100);
        throttle = Math.max(0, Math.min(100, throttle));

        // Lenkung (-100 bis +100)
        let steering = Math.round(rawSteering * 100);

        // Motoren-Mischung für Differenzial-Steuerung
        let leftMotor = throttle + (steering * 0.5);
        let rightMotor = throttle - (steering * 0.5);

        // Werte auf 0-100% begrenzen
        leftMotor = Math.max(0, Math.min(100, Math.round(leftMotor)));
        rightMotor = Math.max(0, Math.min(100, Math.round(rightMotor)));

        // UI aktualisieren
        document.getElementById('throttleVal').innerText = throttle + " %";
        document.getElementById('steeringVal').innerText = steering;
        document.getElementById('motorLeftVal').innerText = leftMotor + " %";
        document.getElementById('motorRightVal').innerText = rightMotor + " %";

        // Befehl an PowerUp senden
        sendMotorCommands(leftMotor, rightMotor);
      } else {
        document.getElementById('gamepadStatus').innerText = "Kein Controller aktiv (Taste drücken)";
      }

      requestAnimationFrame(loop);
    }

    // Daten-Senden mit Intervall-Schutz (max. 20 Hz, um Bluetooth nicht zu überlasten)
    let lastSendTime = 0;
    async function sendMotorCommands(left, right) {
      const now = Date.now();
      if (!isConnected || !controlCharacteristic || (now - lastSendTime < 50)) {
        return; 
      }
      lastSendTime = now;

      try {
        // Umrechnung von % auf Byte-Werte (0 bis 255 PWM)
        const leftPwm = Math.round((left / 100) * 255);
        const rightPwm = Math.round((right / 100) * 255);

        const data = new Uint8Array([leftPwm, rightPwm]);
        await controlCharacteristic.writeValueWithoutResponse(data);
      } catch (err) {
        console.warn("BLE Sende-Fehler:", err);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
